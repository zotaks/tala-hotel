<!DOCTYPE html>
<html>
<head>
  <!-- $FLUTTER_BASE_HREF is replaced by `flutter build web --base-href` -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tala Hotel — book your stay in Dagupan City">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tala Hotel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Tala Hotel</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0D; }
    /* shown until Flutter draws its first frame */
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              font: 800 34px/1 system-ui, sans-serif; color: #F4F4F2; letter-spacing: -1px; }
    #loader span { color: #F2762E; font-size: 22px; margin-left: 4px; animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .3; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="loader">tala<span>✦</span></div>
  <script>
    // remove the loader once Flutter has started
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader'); if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
